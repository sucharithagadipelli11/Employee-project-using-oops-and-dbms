<!DOCTYPE html>
<html>
<head>
    <title>Add Employee</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
        }

        .form-box {
            background: white;
            width: 300px;
            margin: auto;
            margin-top: 50px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px;
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: #4a5bdc;
        }
    </style>
</head>

<body>

<h2>Add Employee</h2>

<div class="form-box">
    <form method="POST">
        <input name="name" placeholder="Name"><br>
        <input name="dept" placeholder="Department"><br>
        <input name="salary" placeholder="Salary per day"><br>
        <button type="submit">Add</button>
    </form>
</div>

</body>
</html>
