<!DOCTYPE html>
<html>
<head>
    <title>Employees</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f0f0f0;
        }

        table {
            margin: auto;
            margin-top: 30px;
            border-collapse: collapse;
            width: 70%;
            background: white;
            box-shadow: 0px 0px 10px gray;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
        }

        th {
            background: #667eea;
            color: white;
        }

        tr:hover {
            background: #f1f1f1;
        }
    </style>
</head>

<body>

<h2>Employee List</h2>

<table>
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Department</th>
    <th>Salary</th>
</tr>

{% for row in data %}
<tr>
    <td>{{row[0]}}</td>
    <td>{{row[1]}}</td>
    <td>{{row[2]}}</td>
    <td>{{row[3]}}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
